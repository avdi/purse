# Declarative manifest of agent plugin marketplaces and plugins, shared across
# every agent that natively supports the Claude plugin/marketplace format
# (Claude Code, Codex CLI, GitHub Copilot CLI, Auggie), plus skills.sh fallback
# packages for agents that cannot consume a particular native plugin. Each
# marketplace and plugin declares which native agents it should target.
# Auggie uses the same `plugin marketplace add` / `plugin install` verbs and
# recognizes both .claude-plugin and .augment-plugin manifests.
#
# VS Code also supports this plugin format (Preview), but only via
# global-user settings.json — no CLI verb — so it's intentionally left
# unmanaged here, alongside Cursor/Devin/Antigravity which don't share the
# format at all.
#
# The purse-outfit-agents script renders these values inline and installs
# them when run manually. Each agent's own runtime plugin-state file is
# intentionally NOT managed by chezmoi, since the CLI rewrites it on every
# install (e.g. Claude's ~/.claude/plugins/installed_plugins.json).
agentPlugins:
  # Agents this manifest can target; the installer only acts on entries whose
  # CLI is actually present on the machine.
  agents:
    - claude
    - codex
    - copilot
    - auggie

  # Marketplaces to register, and which agents should register each one.
  # Built-in marketplaces (e.g. claude-plugins-official) are only auto-seeded
  # on an interactive first launch, so we register them explicitly here.
  marketplaces:
    # copilot's marketplace schema rejects several `source` shapes used in
    # this marketplace.json (same family of incompatibility as the copilot
    # GitHub MCP header, see register_copilot in purse-outfit-agents), so it
    # stays out of this one.
    - name: claude-plugins-official
      source: anthropics/claude-plugins-official
      agents: [claude, codex, auggie]
    - name: context7-marketplace
      source: upstash/context7
      agents: [claude, codex, copilot, auggie]
    - name: worktrunk
      source: max-sixty/worktrunk
      agents: [claude, codex]
    # copilot can't use claude-plugins-official (see above), but superpowers
    # publishes its own marketplace that copilot's schema accepts.
    - name: superpowers-marketplace
      source: obra/superpowers-marketplace
      agents: [copilot]
    # caveman only ships a Claude plugin; Codex/Copilot use incompatible
    # mechanisms (npx skills add / bespoke installer), so it stays claude-only.
    - name: caveman
      source: JuliusBrussee/caveman
      agents: [claude]
    # context-mode's docs only quote the Claude /plugin flow; Codex/Copilot
    # plugin support is unverified, so it stays claude-only.
    - name: context-mode
      source: mksglu/context-mode
      agents: [claude]
    # mattpocock-skills deliberately ships only a Claude plugin; its Codex
    # plugin is deferred because Codex cannot express the curated skill paths.
    - name: mattpocock
      source: mattpocock/skills
      agents: [claude]

  # Plugins to install, in `name@marketplace` form, and which agents should
  # install each one.
  plugins:
    - name: superpowers
      marketplace: claude-plugins-official
      agents: [claude, codex, auggie]
    - name: superpowers
      marketplace: superpowers-marketplace
      agents: [copilot]
    - name: context7
      marketplace: context7-marketplace
      agents: [claude, codex, copilot, auggie]
    - name: ralph-loop
      marketplace: claude-plugins-official
      agents: [claude, codex, auggie]
    - name: claude-code-setup
      marketplace: claude-plugins-official
      agents: [claude]
    - name: claude-md-management
      marketplace: claude-plugins-official
      agents: [claude]
    - name: worktrunk
      marketplace: worktrunk
      agents: [claude]
    - name: caveman
      marketplace: caveman
      agents: [claude]
    - name: context-mode
      marketplace: context-mode
      agents: [claude]
    - name: mattpocock-skills
      marketplace: mattpocock
      agents: [claude]

  # Universal Agent Skills packages for agents not covered by a package's
  # native plugin. `command` detects an installed agent; `target` is the
  # corresponding skills.sh agent identifier.
  skillPackages:
    - source: mattpocock/skills
      agents:
        - command: codex
          target: codex
        - command: agy
          target: antigravity-cli
        - command: auggie
          target: augment
        - command: copilot
          target: github-copilot
        - command: cursor-agent
          target: cursor
        - command: opencode
          target: opencode
        - command: devin
          target: devin
