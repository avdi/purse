# Declarative MCP server shortlist. Token VALUES are never stored here — only
# env-var reference strings, expanded by each agent at runtime from the shell env.
#
# Two kinds of agent read this list, and the difference is who owns the config
# file at the other end:
#
#   Rendered directly. cursor, copilot, opencode and antigravity each keep their
#   MCP registry in a file nothing but purse writes, so chezmoi renders it whole
#   from here — see home/dot_cursor/private_mcp.json.tmpl and its three
#   siblings. A server dropped from this list disappears from those files on the
#   next apply, which an `mcp add` command could never manage.
#
#   Merged by purse-outfit-agents. The agents in mcpAgents below keep their MCP
#   entries inside a file they also write themselves — Claude's ~/.claude.json
#   holds its caches and history, devin's holds an org id. Those are merged in place
#   with the agent's own CLI or with jq, never replaced.
mcpServers:
  github:
    description: "GitHub MCP (issues, PRs, repos, code search)"
    transport: http
    url: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}"
    requiresEnv:
      - GITHUB_PERSONAL_ACCESS_TOKEN
    # copilot does not expand ${VAR} inside a header value — it would send the
    # literal string and get a 400. copilot has its own GitHub connection.
    excludeAgents: [copilot]
  playwright:
    description: "Playwright browser automation MCP"
    transport: stdio
    command: npx
    args: ["-y", "@playwright/mcp@latest"]
    requiresEnv: []
    excludeAgents: []
  ripgrep:
    description: "ripgrep code search via MCP"
    transport: stdio
    command: npx
    args: ["-y", "mcp-ripgrep@latest"]
    requiresEnv: []
    excludeAgents: []
  kagi:
    description: "Kagi web search & page extraction (kagimcp)"
    transport: stdio
    command: uvx
    args: ["kagimcp"]
    requiresEnv:
      - KAGI_API_KEY
    excludeAgents: []
    # kagimcp reads KAGI_API_KEY out of its inherited environment — no env
    # block in any agent config, and no value anywhere. The var comes to the
    # agent's env from ~/.config/shell/secrets.sh (a PURSE_TOKENS field), and
    # the devcontainer shim forwards it into containers the same way, so a
    # spawned server inherits it in both places. requiresEnv documents the
    # dependency here; only the http branch above reads it (for the Bearer
    # header). uv is in packages.yaml, so uvx ships everywhere dotfiles do.

# Servers dropped from the shortlist. The rendered registries lose them on the
# next apply by themselves; the merged ones in mcpAgents keep a server until
# something removes it, so purse-outfit-agents removes each name listed here
# from every merged agent. Add a name here (not in the script) when retiring
# a server; the entry can go once every machine has been outfitted since.
retiredMcpServers:
  - codebase-memory-mcp
  - auggie

# Agents purse-outfit-agents merges into. The four rendered by chezmoi are
# deliberately absent — listing one here would make two writers of one file.
mcpAgents:
  - claude
  - codex
  - vscode
  - devin
